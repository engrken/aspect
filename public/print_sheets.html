<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASPECT — Standardized OMR Sheet Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style id="page-orientation-style">
    @page { size: letter landscape; margin: 4mm 6mm; }
  </style>
  <style>
    * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111; margin: 0; padding: 0; background: #fff; }

    .sheet-page-50 { display: table; width: 100%; height: 100%; page-break-after: always; break-after: page; table-layout: fixed; }
    .sheet-page-50:last-child { page-break-after: avoid; break-after: avoid; }
    .half-sheet { display: table-cell; width: 50%; vertical-align: top; position: relative; padding: 6px 14px; page-break-inside: avoid; }
    .left-half { border-right: 1.5px dashed #888; padding-right: 16px; }
    .right-half { padding-left: 16px; }

    .grid-3col { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; gap: 16px; }
    .block-top-50 { min-height: calc(8 * 17.5px); }
    .block-divider-50 { height: 18px; }

    .sheet-page-100 { width: 100%; height: 100vh; page-break-after: always; break-after: page; position: relative; padding: 10px 18px; overflow: hidden; }
    .sheet-page-100:last-child { page-break-after: avoid; break-after: avoid; }
    .grid-4col { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; gap: 12px; margin-top: 8px; }

    .fiducial { width: 14px; height: 14px; background: #000 !important; position: absolute; }
    .f-tl { top: 6px; left: 6px; }
    .f-tr { top: 6px; right: 6px; }
    .f-bl { bottom: 8px; left: 6px; }
    .f-br { bottom: 8px; right: 6px; }
    .f-ml { top: 228px; left: 6px; }
    .f-mr { top: 228px; right: 6px; }

    .header-table { width: 100%; border-bottom: 1.5px solid #000; padding-bottom: 3px; margin-bottom: 4px; }
    .inst-name { font-size: 8.5pt; font-weight: bold; text-transform: uppercase; line-height: 1.15; }
    .subject-title { font-size: 8.5pt; margin-top: 1px; }

    .meta-box { display: table; width: 100%; background: #f8f9fa; border: 1px solid #333; border-radius: 4px; margin-bottom: 6px; padding: 4px 8px; }
    .meta-cell-info { display: table-cell; vertical-align: middle; width: 75%; }
    .meta-cell-qr { display: table-cell; vertical-align: middle; text-align: right; width: 25%; }
    .student-name { font-size: 9.5pt; font-weight: bold; }
    .student-id { font-family: monospace; font-size: 9.5pt; font-weight: bold; color: #0d6efd; }
    
    .set-selector { margin-top: 3px; font-size: 8pt; }
    .bubble-set { width: 14px; height: 14px; border: 1px solid #767676; color: #666; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 7.2pt; font-weight: 500; margin: 0 1px; }
    .qr-container { display: inline-block; width: 62px; height: 62px; }
    .qr-container img, .qr-container canvas { width: 62px !important; height: 62px !important; display: block; }
    .qr-caption { font-size: 6pt; font-family: monospace; display: block; text-align: center; }

    .item-row { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; border-bottom: 0.5px dotted #e0e0e0; height: 17.5px; line-height: 17px; }
    .item-num { display: inline-block; width: 22px; font-size: 8pt; font-weight: bold; text-align: right; margin-right: 4px; color: #333; }
    .item-bubbles { display: inline-flex; align-items: center; gap: 3.5px; }
    .bubble { width: 13.5px; height: 13.5px; border: 1px solid #767676; color: #666; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 7.2pt; font-weight: 500; }

    @media print { #loading-screen { display: none !important; } }
  </style>
  
  <script src="js/config.js"></script>
</head>
<body>

  <div id="loading-screen" style="text-align: center; padding: 50px; font-family: sans-serif;">
    <h3 style="margin-bottom: 6px;">Compiling Examination Sheets...</h3>
    <p style="color: #666; font-size: 14px;">Applying optical contrast calibration.</p>
  </div>

  <div id="sheets-root"></div>

  <script>
const API_BASE_URL = window.ASPECT_CONFIG?.API_URL || '/api';

    async function initPrint() {
      const urlParams = new URLSearchParams(window.location.search);
      const classId = urlParams.get('classId');
      const sessionToken = localStorage.getItem('aspect_token');

      if (!classId || !sessionToken) {
        alert("Session expired or missing Class ID.");
        window.close();
        return;
      }

      try {
        const fetchApi = (payload) => fetch(API_BASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(r => r.json());

        const [enrollRes, configRes, classRes] = await Promise.all([
          fetchApi({ action: 'GET_CLASS_ENROLLMENTS', sessionToken, classId }),
          fetchApi({ action: 'GET_FULL_EXAM_CONFIG', sessionToken, classId }),
          fetchApi({ action: 'GET_CLASSES', sessionToken })
        ]);

        if (!enrollRes.success || !enrollRes.enrolledStudents || enrollRes.enrolledStudents.length === 0) {
          alert("No enrolled students found.");
          window.close();
          return;
        }

        const activeClass = (classRes.classes && classRes.classes.find(c => c.classId === classId)) || {
          subjectCode: 'EXAM',
          subjectTitle: 'Collegiate Examination'
        };

        const students = enrollRes.enrolledStudents;
        const itemsCount = (configRes.items && configRes.items.length > 0) ? configRes.items.length : 50;
        const root = document.getElementById('sheets-root');

        if (itemsCount <= 50) {
          document.getElementById('page-orientation-style').innerHTML = '@page { size: letter landscape; margin: 4mm 6mm; }';
          render50Batch(students, activeClass, itemsCount, root);
        } else {
          document.getElementById('page-orientation-style').innerHTML = '@page { size: letter portrait; margin: 6mm 8mm; }';
          render100Batch(students, activeClass, itemsCount, root);
        }

        document.getElementById('loading-screen').style.display = 'none';
        setTimeout(() => window.print(), 500);

      } catch (err) {
        alert("Error preparing sheets: " + err);
      }
    }

    function render50Batch(students, cls, itemsCount, root) {
      for (let s = 0; s < students.length; s += 2) {
        const st1 = students[s];
        const st2 = (s + 1 < students.length) ? students[s + 1] : null;

        const pageDiv = document.createElement('div');
        pageDiv.className = 'sheet-page-50';
        pageDiv.innerHTML = `
          <div class="half-sheet left-half">${renderHalfSheet50(st1, cls, s + 1, students.length, itemsCount)}</div>
          <div class="half-sheet right-half">${st2 ? renderHalfSheet50(st2, cls, s + 2, students.length, itemsCount) : ''}</div>
        `;
        root.appendChild(pageDiv);

        new QRCode(document.getElementById(`qr-${st1.studentId}`), {
          text: `ASPECT|${cls.subjectCode}|${st1.studentId}|F50_${itemsCount}`,
          width: 60, height: 60, correctLevel: QRCode.CorrectLevel.M
        });
        if (st2) {
          new QRCode(document.getElementById(`qr-${st2.studentId}`), {
            text: `ASPECT|${cls.subjectCode}|${st2.studentId}|F50_${itemsCount}`,
            width: 60, height: 60, correctLevel: QRCode.CorrectLevel.M
          });
        }
      }
    }

    function renderHalfSheet50(st, cls, currentSheet, totalSheets, itemsCount) {
      const columnsData = [
        { topStart: 1, topEnd: 8, botStart: 9, botEnd: 17 },
        { topStart: 18, topEnd: 25, botStart: 26, botEnd: 34 },
        { topStart: 35, topEnd: 42, botStart: 43, botEnd: 50 }
      ];

      let columnsHtml = '';
      columnsData.forEach(col => {
        let topRows = '';
        for (let i = col.topStart; i <= col.topEnd; i++) {
          if (i <= itemsCount) topRows += renderRowHtml(i);
        }

        let botRows = '';
        for (let i = col.botStart; i <= col.botEnd; i++) {
          if (i <= itemsCount) botRows += renderRowHtml(i);
        }

        columnsHtml += `
          <div>
            <div class="block-top-50">${topRows}</div>
            <div class="block-divider-50"></div>
            <div>${botRows}</div>
          </div>
        `;
      });

      return `
        <div class="fiducial f-tl"></div><div class="fiducial f-tr"></div>
        <div class="fiducial f-bl"></div><div class="fiducial f-br"></div>
        <div class="fiducial f-ml"></div><div class="fiducial f-mr"></div>
        <div class="fiducial" style="top:236px; left:50%; transform:translateX(-50%); width:12px; height:10px;"></div>

        <table class="header-table">
          <tr>
            <td style="vertical-align:middle; padding-left:18px;">
              <div class="inst-name">FILAMER CHRISTIAN UNIVERSITY<br>College of Engineering</div>
              <div class="subject-title">${cls.subjectCode}: ${cls.subjectTitle} (${itemsCount} Items)</div>
            </td>
            <td style="text-align:right; vertical-align:bottom; font-family:monospace; font-size:7pt; padding-right:18px;">SHEET ${currentSheet} OF ${totalSheets}</td>
          </tr>
        </table>

        <div class="meta-box">
          <div class="meta-cell-info">
            <div><small style="color:#555; font-size:7.5pt;">Name:</small> <span class="student-name">${st.fullName}</span></div>
            <div><small style="color:#555; font-size:7.5pt;">ID:</small> <span class="student-id">${st.studentId}</span> &nbsp;|&nbsp; <small style="color:#555; font-size:7.5pt;">Sec:</small> <strong>${st.section}</strong></div>
            <div class="set-selector"><strong>Set:</strong> &nbsp;<span class="bubble-set">A</span> <small>SET A</small>&nbsp;&nbsp;<span class="bubble-set">B</span> <small>SET B</small></div>
          </div>
          <div class="meta-cell-qr"><div id="qr-${st.studentId}" class="qr-container"></div><span class="qr-caption">${st.studentId}</span></div>
        </div>

        <div class="grid-3col">${columnsHtml}</div>
      `;
    }

    function render100Batch(students, cls, itemsCount, root) {
      students.forEach((st, idx) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'sheet-page-100';

        let columnsHtml = '';
        for (let c = 0; c < 4; c++) {
          let rowsHtml = '';
          for (let r = 1; r <= 25; r++) {
            const itemNum = c * 25 + r;
            if (itemNum <= itemsCount) rowsHtml += renderRowHtml(itemNum);
          }
          columnsHtml += `<div>${rowsHtml}</div>`;
        }

        pageDiv.innerHTML = `
          <div class="fiducial f-tl"></div><div class="fiducial f-tr"></div>
          <div class="fiducial f-bl"></div><div class="fiducial f-br"></div>
          <div class="fiducial f-ml" style="top:50%; transform:translateY(-50%);"></div>
          <div class="fiducial f-mr" style="top:50%; transform:translateY(-50%);"></div>

          <table class="header-table">
            <tr>
              <td style="vertical-align: middle; padding-left: 20px;">
                <div class="inst-name">FILAMER CHRISTIAN UNIVERSITY<br>College of Engineering</div>
                <div class="subject-title">${cls.subjectCode}: ${cls.subjectTitle} — Examination (${itemsCount} Items)</div>
              </td>
              <td style="text-align: right; vertical-align: bottom; font-family: monospace; font-size: 7.5pt; padding-right: 20px;">
                EXAMINEE ${idx + 1} OF ${students.length}
              </td>
            </tr>
          </table>

          <div class="meta-box">
            <div class="meta-cell-info">
              <div><small style="color: #555; font-size: 8pt;">Name:</small> <span class="student-name">${st.fullName}</span></div>
              <div><small style="color: #555; font-size: 8pt;">ID:</small> <span class="student-id">${st.studentId}</span> &nbsp;|&nbsp; <small style="color: #555; font-size: 8pt;">Sec:</small> <strong>${st.section}</strong></div>
              <div class="set-selector">
                <strong>Test Set:</strong> &nbsp;<span class="bubble-set">A</span> <small>SET A</small> &nbsp;&nbsp;&nbsp;<span class="bubble-set">B</span> <small>SET B</small>
              </div>
            </div>
            <div class="meta-cell-qr">
              <div id="qr-${st.studentId}" class="qr-container"></div>
              <span class="qr-caption">${st.studentId}</span>
            </div>
          </div>

          <div class="grid-4col">${columnsHtml}</div>
        `;
        root.appendChild(pageDiv);

        new QRCode(document.getElementById(`qr-${st.studentId}`), {
          text: `ASPECT|${cls.subjectCode}|${st.studentId}|F100_${itemsCount}`,
          width: 62, height: 62, correctLevel: QRCode.CorrectLevel.M
        });
      });
    }

    function renderRowHtml(num) {
      return `
        <div class="item-row">
          <span class="item-num">${num}.</span>
          <span class="item-bubbles">
            <span class="bubble">A</span><span class="bubble">B</span><span class="bubble">C</span><span class="bubble">D</span>
          </span>
        </div>`;
    }

    window.addEventListener('DOMContentLoaded', initPrint);
  </script>
</body>
</html>

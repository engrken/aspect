<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASPECT — Standardized OMR Sheet Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style id="page-orientation-style">
    @page { size: letter landscape; margin: 4mm 6mm; }
  </style>
  <style>
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #111;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    /* 50-ITEM TWO-UP LANDSCAPE LAYOUT */
    .sheet-page-50 {
      display: table;
      width: 100%;
      page-break-after: always;
      break-after: page;
      table-layout: fixed;
    }
    .sheet-page-50:last-child {
      page-break-after: avoid;
      break-after: avoid;
    }
    .half-sheet {
      display: table-cell;
      width: 50%;
      vertical-align: top;
      padding: 6px 4px;
      page-break-inside: avoid;
    }
    .left-half {
      border-right: 1.5px dashed #999;
    }

    /* Fixed-pixel coordinate frame for 1-50 items (464 x 492 px) */
    .omr-box-50 {
      position: relative;
      width: 464px;
      height: 492px;
      margin: 0 auto;
      background: #fff;
    }

    /* 100-ITEM PORTRAIT LAYOUT */
    .sheet-page-100 {
      width: 100%;
      page-break-after: always;
      break-after: page;
      padding: 12px 0;
    }
    .sheet-page-100:last-child {
      page-break-after: avoid;
      break-after: avoid;
    }

    /* Fixed-pixel coordinate frame for 51-100 items (680 x 640 px) */
    .omr-box-100 {
      position: relative;
      width: 680px;
      height: 640px;
      margin: 0 auto;
      background: #fff;
    }

    /* FIDUCIAL REGISTRATION MARKERS (14x14px solid black squares) */
    .fiducial {
      width: 14px;
      height: 14px;
      background: #000 !important;
      position: absolute;
      z-index: 10;
    }
    .f-tl { top: 6px; left: 6px; }
    .f-tr { top: 6px; right: 6px; }
    .f-bl { bottom: 6px; left: 6px; }
    .f-br { bottom: 6px; right: 6px; }
    /* Middle rail markers sit inside the empty divider gap between Row 8 and Row 9 */
    .f-ml-50 { top: 287px; left: 6px; }
    .f-mr-50 { top: 287px; right: 6px; }
    .f-ml-100 { top: 313px; left: 6px; }
    .f-mr-100 { top: 313px; right: 6px; }

    /* HEADER & METADATA BOX (Positioned inside 28px safe zone) */
    .omr-header {
      position: absolute;
      top: 10px;
      left: 28px;
      right: 28px;
      height: 38px;
      border-bottom: 1.5px solid #000;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 4px;
    }
    .inst-name {
      font-size: 8.5pt;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .subject-title {
      font-size: 8pt;
      font-weight: 600;
      color: #222;
      margin-top: 1px;
    }
    .sheet-counter {
      font-family: monospace;
      font-size: 7.5pt;
      font-weight: bold;
      white-space: nowrap;
    }

    .meta-box {
      position: absolute;
      top: 54px;
      left: 28px;
      right: 28px;
      height: 78px;
      background: #f8f9fa;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      max-width: 76%;
    }
    .student-name {
      font-size: 9.5pt;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .student-id {
      font-family: monospace;
      font-size: 9.5pt;
      font-weight: 700;
      color: #0d6efd;
    }
    .set-selector {
      font-size: 8pt;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 1px;
    }
    .bubble-set {
      width: 14px;
      height: 14px;
      border: 1.2px solid #555;
      color: #444;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 7pt;
      font-weight: 700;
    }
    .meta-qr {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .qr-container {
      width: 56px;
      height: 56px;
    }
    .qr-container img, .qr-container canvas {
      width: 56px !important;
      height: 56px !important;
      display: block;
    }
    .qr-caption {
      font-size: 5.8pt;
      font-family: monospace;
      margin-top: 2px;
      line-height: 1;
    }

    /* DETERMINISTIC ITEM COLUMNS & COMPACT BUBBLE ROWS */
    .col-50-0 { position: absolute; left: 30px; width: 105px; }
    .col-50-1 { position: absolute; left: 172px; width: 105px; }
    .col-50-2 { position: absolute; left: 314px; width: 105px; }

    .block-top-50 { top: 142px; height: 144px; }
    .block-bot-50 { top: 302px; height: 162px; }

    .col-100-0 { position: absolute; top: 142px; left: 34px; width: 110px; }
    .col-100-1 { position: absolute; top: 142px; left: 192px; width: 110px; }
    .col-100-2 { position: absolute; top: 142px; left: 350px; width: 110px; }
    .col-100-3 { position: absolute; top: 142px; left: 508px; width: 110px; }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 18px;
      border-bottom: 0.5px dotted #dcdcdc;
    }
    .item-num {
      width: 22px;
      font-size: 8pt;
      font-weight: 700;
      text-align: right;
      margin-right: 6px;
      color: #222;
      flex-shrink: 0;
    }
    .omr-box-100 .item-num {
      width: 24px;
    }
    .item-bubbles {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .bubble {
      width: 14px;
      height: 14px;
      border: 1.2px solid #555;
      color: #555;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 7pt;
      font-weight: 600;
      line-height: 1;
    }

    @media print {
      #loading-screen { display: none !important; }
    }
  </style>
  <script src="js/config.js"></script>
</head>
<body>

  <div id="loading-screen" style="text-align: center; padding: 50px; font-family: sans-serif;">
    <h3 style="margin-bottom: 6px;">Compiling Standardized OMR Sheets...</h3>
    <p style="color: #666; font-size: 14px;">Applying optical contrast and fixed-grid calibration.</p>
  </div>

  <div id="sheets-root"></div>

  <script>
    const API_BASE_URL = window.ASPECT_CONFIG?.API_URL || '/api';

    async function initPrint() {
      const urlParams = new URLSearchParams(window.location.search);
      const classId = urlParams.get('classId');
      const sessionToken = localStorage.getItem('aspect_token');

      if (!classId || !sessionToken) {
        alert("Session expired or missing Class ID.");
        window.close();
        return;
      }

      try {
        const fetchApi = (payload) => fetch(API_BASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(r => r.json());

        const [enrollRes, configRes, classRes] = await Promise.all([
          fetchApi({ action: 'GET_CLASS_ENROLLMENTS', sessionToken, classId }),
          fetchApi({ action: 'GET_FULL_EXAM_CONFIG', sessionToken, classId }),
          fetchApi({ action: 'GET_CLASSES', sessionToken })
        ]);

        const activeClass = (classRes.classes && classRes.classes.find(c => c.classId === classId)) || {
          subjectCode: 'EXAM',
          subjectTitle: 'Collegiate Examination',
          defaultSection: 'BS-ECE'
        };

        // If no students enrolled yet, generate a Demo Sheet so faculty can test-print immediately
        const students = (enrollRes.success && enrollRes.enrolledStudents && enrollRes.enrolledStudents.length > 0)
          ? enrollRes.enrolledStudents
          : [{ studentId: '26-COE-9999', fullName: 'Demo Student', section: activeClass.defaultSection || 'BS-ECE' }];

        const itemsCount = (configRes.items && configRes.items.length > 0) ? configRes.items.length : 50;
        const root = document.getElementById('sheets-root');

        if (itemsCount <= 50) {
          document.getElementById('page-orientation-style').innerHTML = '@page { size: letter landscape; margin: 4mm 6mm; }';
          render50Batch(students, activeClass, itemsCount, root);
        } else {
          document.getElementById('page-orientation-style').innerHTML = '@page { size: letter portrait; margin: 6mm 8mm; }';
          render100Batch(students, activeClass, itemsCount, root);
        }

        document.getElementById('loading-screen').style.display = 'none';
        setTimeout(() => window.print(), 500);

      } catch (err) {
        alert("Error preparing sheets: " + err);
      }
    }

    function render50Batch(students, cls, itemsCount, root) {
      for (let s = 0; s < students.length; s += 2) {
        const st1 = students[s];
        const st2 = (s + 1 < students.length) ? students[s + 1] : null;

        const pageDiv = document.createElement('div');
        pageDiv.className = 'sheet-page-50';
        pageDiv.innerHTML = `
          <div class="half-sheet left-half">${renderHalfSheet50(st1, cls, s + 1, students.length, itemsCount)}</div>
          <div class="half-sheet right-half">${st2 ? renderHalfSheet50(st2, cls, s + 2, students.length, itemsCount) : ''}</div>
        `;
        root.appendChild(pageDiv);

        new QRCode(document.getElementById(`qr-${s}`), {
          text: `ASPECT|${cls.subjectCode}|${st1.studentId}|F50_${itemsCount}`,
          width: 56, height: 56, correctLevel: QRCode.CorrectLevel.M
        });
        if (st2) {
          new QRCode(document.getElementById(`qr-${s + 1}`), {
            text: `ASPECT|${cls.subjectCode}|${st2.studentId}|F50_${itemsCount}`,
            width: 56, height: 56, correctLevel: QRCode.CorrectLevel.M
          });
        }
      }
    }

    function renderHalfSheet50(st, cls, currentSheet, totalSheets, itemsCount) {
      const qrDomId = `qr-${currentSheet - 1}`;
      const columnsData = [
        { colIdx: 0, topStart: 1, topEnd: 8, botStart: 9, botEnd: 17 },
        { colIdx: 1, topStart: 18, topEnd: 25, botStart: 26, botEnd: 34 },
        { colIdx: 2, topStart: 35, topEnd: 42, botStart: 43, botEnd: 50 }
      ];

      let blocksHtml = '';
      columnsData.forEach(col => {
        let topRows = '';
        for (let i = col.topStart; i <= col.topEnd; i++) {
          if (i <= itemsCount) topRows += renderRowHtml(i);
        }
        let botRows = '';
        for (let i = col.botStart; i <= col.botEnd; i++) {
          if (i <= itemsCount) botRows += renderRowHtml(i);
        }
        blocksHtml += `
          <div class="col-50-${col.colIdx} block-top-50">${topRows}</div>
          <div class="col-50-${col.colIdx} block-bot-50">${botRows}</div>
        `;
      });

      return `
        <div class="omr-box-50">
          <div class="fiducial f-tl"></div>
          <div class="fiducial f-tr"></div>
          <div class="fiducial f-ml-50"></div>
          <div class="fiducial f-mr-50"></div>
          <div class="fiducial f-bl"></div>
          <div class="fiducial f-br"></div>

          <div class="omr-header">
            <div>
              <div class="inst-name">FILAMER CHRISTIAN UNIVERSITY — College of Engineering</div>
              <div class="subject-title">${cls.subjectCode}: ${cls.subjectTitle} (${itemsCount} Items)</div>
            </div>
            <div class="sheet-counter">SHEET ${currentSheet} OF ${totalSheets}</div>
          </div>

          <div class="meta-box">
            <div class="meta-info">
              <div><small style="color:#555; font-size:7.5pt;">Name:</small> <span class="student-name">${st.fullName}</span></div>
              <div><small style="color:#555; font-size:7.5pt;">ID:</small> <span class="student-id">${st.studentId}</span> &nbsp;|&nbsp; <small style="color:#555; font-size:7.5pt;">Sec:</small> <strong style="font-size:8.5pt;">${st.section}</strong></div>
              <div class="set-selector">
                <strong>Set:</strong>
                <span class="bubble-set">A</span> <small>SET A</small>
                <span>&nbsp;</span>
                <span class="bubble-set">B</span> <small>SET B</small>
              </div>
            </div>
            <div class="meta-qr">
              <div id="${qrDomId}" class="qr-container"></div>
              <span class="qr-caption">${st.studentId}</span>
            </div>
          </div>

          ${blocksHtml}
        </div>
      `;
    }

    function render100Batch(students, cls, itemsCount, root) {
      students.forEach((st, idx) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'sheet-page-100';

        let colsHtml = '';
        for (let c = 0; c < 4; c++) {
          let rowsHtml = '';
          for (let r = 1; r <= 25; r++) {
            const itemNum = c * 25 + r;
            if (itemNum <= itemsCount) rowsHtml += renderRowHtml(itemNum);
          }
          colsHtml += `<div class="col-100-${c}">${rowsHtml}</div>`;
        }

        pageDiv.innerHTML = `
          <div class="omr-box-100">
            <div class="fiducial f-tl"></div>
            <div class="fiducial f-tr"></div>
            <div class="fiducial f-ml-100"></div>
            <div class="fiducial f-mr-100"></div>
            <div class="fiducial f-bl"></div>
            <div class="fiducial f-br"></div>

            <div class="omr-header">
              <div>
                <div class="inst-name">FILAMER CHRISTIAN UNIVERSITY — College of Engineering</div>
                <div class="subject-title">${cls.subjectCode}: ${cls.subjectTitle} — Examination (${itemsCount} Items)</div>
              </div>
              <div class="sheet-counter">EXAMINEE ${idx + 1} OF ${students.length}</div>
            </div>

            <div class="meta-box">
              <div class="meta-info">
                <div><small style="color:#555; font-size:8pt;">Name:</small> <span class="student-name">${st.fullName}</span></div>
                <div><small style="color:#555; font-size:8pt;">ID:</small> <span class="student-id">${st.studentId}</span> &nbsp;|&nbsp; <small style="color:#555; font-size:8pt;">Sec:</small> <strong>${st.section}</strong></div>
                <div class="set-selector">
                  <strong>Test Set:</strong>
                  <span class="bubble-set">A</span> <small>SET A</small>
                  <span>&nbsp;&nbsp;</span>
                  <span class="bubble-set">B</span> <small>SET B</small>
                </div>
              </div>
              <div class="meta-qr">
                <div id="qr100-${idx}" class="qr-container"></div>
                <span class="qr-caption">${st.studentId}</span>
              </div>
            </div>

            ${colsHtml}
          </div>
        `;
        root.appendChild(pageDiv);

        new QRCode(document.getElementById(`qr100-${idx}`), {
          text: `ASPECT|${cls.subjectCode}|${st.studentId}|F100_${itemsCount}`,
          width: 56, height: 56, correctLevel: QRCode.CorrectLevel.M
        });
      });
    }

    function renderRowHtml(num) {
      return `
        <div class="item-row">
          <span class="item-num">${num}.</span>
          <span class="item-bubbles">
            <span class="bubble">A</span><span class="bubble">B</span><span class="bubble">C</span><span class="bubble">D</span>
          </span>
        </div>`;
    }

    window.addEventListener('DOMContentLoaded', initPrint);
  </script>
</body>
</html>
